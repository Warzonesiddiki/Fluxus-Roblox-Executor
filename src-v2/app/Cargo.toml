[package]
name = "wsx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebSocket X v2 — main orchestrator daemon"

[[bin]]
name = "wsx-app"
path = "src/main.rs"

[dependencies]
wsx-core = { path = "../core" }
wsx-ipc = { path = "../ipc" }
wsx-vision = { path = "../vision" }
wsx-input = { path = "../input" }
wsx-logic = { path = "../logic" }
wsx-driver = { path = "../driver" }
wsx-kernel = { path = "../kernel" }
wsx-net = { path = "../net" }
wsx-redteam = { path = "../redteam" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

[package]
name = "wsx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Process attachment, memory injection, and sandboxed Luau execution engine"

[dependencies]
# --- Luau scripting runtime ---
# Note: In production, use https://crates.io/crates/luau-src or build Luau from source
# We define a clean API surface so swapping the runtime is trivial.
luau = { package = "luau-src", version = "0.3", optional = true }

# --- Win32 API (Windows targeting) ---
# Memory-safe wrappers around VirtualAllocEx, WriteProcessMemory, etc.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

# --- Logging ---
log = "0.4"
env_logger = "0.11"

# --- Error handling ---
thiserror = "2"

# --- Serde for JSON serialization of execution results ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Random for ASLR-style address generation in tests ---
rand = "0.8"

[features]
default = ["luau"]
luau = ["dep:luau"]